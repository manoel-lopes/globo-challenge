services:
  postgres:
    image: postgres:16-alpine
    container_name: template_pg_test
    ports:
      - '${DB_PORT}:5432'
    env_file:
      - .env.test
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
  redis:
    image: redis:7-alpine
    container_name: template_redis_test
    ports:
      - '${REDIS_PORT}:6379'
