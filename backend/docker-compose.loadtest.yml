services:
  postgres:
    image: postgres:16-alpine
    container_name: logs_pg_loadtest
    ports:
      - '${DB_PORT}:5432'
    env_file:
      - .env.loadtest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - logs_loadtest_pgdata:/var/lib/postgresql/data
    networks:
      - logs_loadtest_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: logs_redis_loadtest
    ports:
      - '${REDIS_PORT}:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    volumes:
      - logs_loadtest_redis:/data
    networks:
      - logs_loadtest_net
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logs_api_loadtest
    ports:
      - '${PORT}:3335'
    env_file:
      - .env.loadtest
    environment:
      NODE_ENV: production
      PORT: 3335
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      UPLOAD_TEMP_DIR: /tmp/log-uploads-loadtest
    volumes:
      - logs_loadtest_uploads:/tmp/log-uploads-loadtest
    networks:
      - logs_loadtest_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2.0
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  logs_loadtest_net:
    name: logs_loadtest_net
    driver: bridge

volumes:
  logs_loadtest_pgdata:
    name: logs_loadtest_pgdata
  logs_loadtest_redis:
    name: logs_loadtest_redis
  logs_loadtest_uploads:
    name: logs_loadtest_uploads
