services:
  postgres:
    image: postgres:16-alpine
    container_name: logs_pg_loadtest
    ports:
      - '${DB_PORT}:5432'
    env_file:
      - .env.loadtest
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - logs_loadtest_pgdata:/var/lib/postgresql/data
    networks:
      - logs_loadtest_net
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: logs_redis_loadtest
    ports:
      - '${REDIS_PORT}:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    volumes:
      - logs_loadtest_redis:/data
    networks:
      - logs_loadtest_net
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  logs_loadtest_net:
    name: logs_loadtest_net
    driver: bridge

volumes:
  logs_loadtest_pgdata:
    name: logs_loadtest_pgdata
  logs_loadtest_redis:
    name: logs_loadtest_redis
