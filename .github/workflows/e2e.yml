name: E2E

on:
  pull_request:

jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          HUSKY: '0'

      - name: Create test env
        run: |
          cat > .env.test << 'EOF'
          # Application
          NODE_ENV=test
          PORT=3334

          # Database
          DB_HOST=localhost
          DB_PORT=5432
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=template_test
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/template_test?schema=public
          DIRECT_URL=postgresql://postgres:postgres@localhost:5432/template_test?schema=public

          # Redis
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_DB=0

          # Upload
          MAX_UPLOAD_SIZE=52428800
          LOG_SYNC_MAX_BYTES=1048576

          # Background queue
          LOG_QUEUE_DRIVER=inline
          LOG_QUEUE_CONCURRENCY=1
          LOG_QUEUE_ATTEMPTS=3

          # Cache
          CACHE_TTL_SECONDS=60
          EOF

      - name: Generate Prisma client
        run: pnpm exec dotenv -e .env.test -- prisma generate

      - name: Run e2e tests
        run: pnpm test:e2e