name: E2E

on:
  pull_request:

jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Create test env
        run: |
          cat > .env.test << 'EOF'
          # Application
          NODE_ENV=test
          PORT=3334

          # Database
          DB_HOST=127.0.0.1
          DB_PORT=5433
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_NAME=template_test
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5433/template_test?schema=public
          DIRECT_URL=postgresql://postgres:postgres@127.0.0.1:5433/template_test?schema=public

          # Redis
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6380
          REDIS_DB=0

          # Upload
          MAX_UPLOAD_SIZE=52428800
          LOG_SYNC_MAX_BYTES=1048576

          # Background queue
          LOG_QUEUE_DRIVER=inline
          LOG_QUEUE_CONCURRENCY=1
          LOG_QUEUE_ATTEMPTS=3

          # Cache
          CACHE_TTL_SECONDS=60
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Generate Prisma client
        run: pnpm exec dotenv -e .env.test -- prisma generate

      - name: Start test database and Redis
        run: pnpm db:up:test

      - name: Wait for PostgreSQL
        run: |
          until docker exec template_pg_test pg_isready -U postgres; do
            sleep 1
          done
          # Extra wait for port mapping to be ready on host
          sleep 5

      - name: Wait for Redis
        run: |
          until docker exec template_redis_test redis-cli ping | grep -q PONG; do
            sleep 1
          done

      - name: Run e2e tests
        run: pnpm test:e2e
