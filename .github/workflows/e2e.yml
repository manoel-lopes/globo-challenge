name: E2E

on:
  pull_request:

jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Create test env
        run: cp .env.test .env.test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: '0'

      - name: Generate Prisma client
        run: pnpm exec dotenv -e .env.test -- prisma generate

      - name: Start test database and Redis
        run: pnpm db:up:test

      - name: Wait for PostgreSQL
        run: |
          until docker exec template_pg_test pg_isready -U postgres; do
            sleep 1
          done

      - name: Wait for Redis
        run: |
          until docker exec template_redis_test redis-cli ping | grep -q PONG; do
            sleep 1
          done

      - name: Run e2e tests
        run: pnpm test:e2e
